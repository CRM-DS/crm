<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customer Support Enterprise CRM</title>
  <link rel="icon" href="https://img.freepik.com/premium-vector/creative-bd-logo-design_773552-463.jpg?semt=ais_hybrid&w=400&q=90">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-crm: #090d16;
      --sidebar-bg: rgba(15, 23, 42, 0.75);
      --border-color: rgba(51, 65, 85, 0.4);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-color: #6366f1;
      --accent-hover: rgba(99, 102, 241, 0.15);
      --active-tab-bg: linear-gradient(135deg, #6366f1, #4f46e5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body, html {
      height: 100%;
      width: 100%;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-crm);
      color: var(--text-main);
      overflow: hidden;
    }

    /* CRM Main Layout */
    .crm-wrapper {
      display: flex;
      height: 100vh;
      width: 100vw;
    }

    /* Sidebar Navigation */
    .crm-sidebar {
      width: 260px;
      background: var(--sidebar-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      z-index: 100;
    }

    .crm-brand {
      padding: 24px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .crm-brand svg { color: var(--accent-color); }
    .crm-brand h1 { font-size: 18px; font-weight: 700; color: var(--text-main); letter-spacing: -0.5px; }

    .nav-menu {
      padding: 20px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
      overflow-y: auto;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 12px;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 1px solid transparent;
    }

    .nav-item:hover {
      background: var(--accent-hover);
      color: var(--text-main);
    }

    .nav-item.active {
      background: var(--active-tab-bg);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.35);
    }

    .crm-user-profile {
      padding: 16px 20px;
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .user-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--accent-color);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
    }

    /* Footer Styling - Left Aligned */
    .crm-footer {
      padding: 12px 20px 16px 20px;
      border-top: 1px solid rgba(51, 65, 85, 0.2);
      font-size: 11px;
      color: var(--text-muted);
      text-align: left;
      line-height: 1.5;
      background: rgba(9, 13, 22, 0.3);
    }

    .crm-footer strong {
      color: var(--text-main);
      font-weight: 600;
    }

    /* Main Content Area */
    .crm-content {
      flex: 1;
      height: 100%;
      position: relative;
      background-color: var(--bg-crm);
    }

    .tool-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: none;
    }

    .tool-frame.active {
      display: block;
    }
  </style>
</head>
<body>

<div class="crm-wrapper">
  <!-- SIDEBAR NAVIGATION -->
  <aside class="crm-sidebar">
    <div class="crm-brand">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
      <h1>Digital Support CRM</h1>
    </div>

    <nav class="nav-menu">
      <!-- 1. DCB Services -->
      <div class="nav-item active" onclick="switchTool('tool1', this)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        <span>DCB Services</span>
      </div>

      <!-- 2. Daily Usage GSM -->
      <div class="nav-item" onclick="switchTool('tool2', this)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
        <span>Daily Usage GSM</span>
      </div>

      <!-- 3. Daily Usage ADSL -->
      <div class="nav-item" onclick="switchTool('tool3', this)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        <span>Daily Usage ADSL</span>
      </div>

      <!-- 4. Bill Explanation -->
      <div class="nav-item" onclick="switchTool('tool4', this)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        <span>Bill Explanation</span>
      </div>

      <!-- 5. WE Bonus -->
      <div class="nav-item" onclick="switchTool('tool5', this)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        <span>WE Bonus</span>
      </div>
    </nav>

    <div class="crm-user-profile">
      <div class="user-avatar">WE</div>
      <div>
        <div style="font-weight:700; color:var(--text-main);">Digital Support</div>
        <div style="font-size:11px;">Agent Workspace</div>
      </div>
    </div>

    <!-- LEFT-ALIGNED FOOTER -->
    <footer class="crm-footer">
      Developed By: <strong>Geek and MZ</strong> ©2026
    </footer>
  </aside>

  <!-- MAIN WORKSPACE FRAMES -->
  <main class="crm-content">
    <iframe id="tool1" class="tool-frame active" src="DCB-Services.html"></iframe>
    <iframe id="tool2" class="tool-frame" src="daily_Usage-GSM.html"></iframe>
    <iframe id="tool3" class="tool-frame" src="Daily_Usage_ADSL.html"></iframe>
    <iframe id="tool4" class="tool-frame" src="Bill-Explanation.html"></iframe>
    <iframe id="tool5" class="tool-frame" src="We-Bonus.html"></iframe>
  </main>
</div>

<script>
  function switchTool(toolId, element) {
    document.querySelectorAll('.tool-frame').forEach(frame => frame.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
    
    document.getElementById(toolId).classList.add('active');
    element.classList.add('active');
  }
</script>

</body>
</html>
