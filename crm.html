<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital Support CRM</title>
  <link rel="icon" href="https://t3.ftcdn.net/jpg/05/10/88/82/360_F_510888200_EentlrpDCeyf2L5FZEeSfgYaeiZ80qAU.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Anti-DevTools Protection Library -->
  <script src="https://cdn.jsdelivr.net/npm/disable-devtool"></script>

  <style>
    :root {
      --bg-crm: #090d16;
      --sidebar-bg: rgba(15, 23, 42, 0.75);
      --border-color: rgba(51, 65, 85, 0.4);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-color: #6366f1;
      --accent-hover: rgba(99, 102, 241, 0.15);
      --active-tab-bg: linear-gradient(135deg, #6366f1, #4f46e5);
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      user-select: none; 
      -webkit-user-select: none; 
    }

    body, html {
      height: 100%;
      width: 100%;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-crm);
      color: var(--text-main);
      overflow: hidden;
    }

    /* CRM Main Layout */
    .crm-wrapper {
      display: flex;
      height: 100vh;
      width: 100vw;
    }

    /* Sidebar Navigation */
    .crm-sidebar {
      width: 260px;
      background: var(--sidebar-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      z-index: 100;
    }

    .crm-brand {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .crm-brand svg { color: var(--accent-color); }
    .crm-brand h1 { font-size: 17px; font-weight: 700; color: var(--text-main); letter-spacing: -0.5px; }

    .nav-menu {
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      overflow-y: hidden;
    }

    .nav-menu::-webkit-scrollbar {
      display: none;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 9px 14px;
      border-radius: 10px;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 1px solid transparent;
    }

    .nav-item:hover {
      background: var(--accent-hover);
      color: var(--text-main);
    }

    .nav-item.active {
      background: var(--active-tab-bg);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.35);
    }

    .crm-user-profile {
      padding: 12px 20px;
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--accent-color);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
    }

    /* Footer Styling - Left Aligned */
    .crm-footer {
      padding: 10px 20px 12px 20px;
      border-top: 1px solid rgba(51, 65, 85, 0.2);
      font-size: 11px;
      color: var(--text-muted);
      text-align: left;
      line-height: 1.5;
      background: rgba(9, 13, 22, 0.3);
    }

    .crm-footer strong {
      color: var(--text-main);
      font-weight: 600;
    }

    /* Main Content Area */
    .crm-content {
      flex: 1;
      height: 100%;
      position: relative;
      background-color: var(--bg-crm);
    }

    .tool-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: none;
    }

    .tool-frame.active {
      display: block;
    }
  </style>
</head>
<body oncontextmenu="return false;">

<div class="crm-wrapper">
  <!-- SIDEBAR NAVIGATION -->
  <aside class="crm-sidebar">
    <div class="crm-brand">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
      <h1>Digital Support CRM</h1>
    </div>

    <nav class="nav-menu">
      <!-- 1. DCB Services Pre -->
      <div class="nav-item active" onclick="switchTool('tool1', this)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        <span>DCB Services Pre</span>
      </div>

      <!-- 2. DCB Services Post -->
      <div class="nav-item" onclick="switchTool('tool2', this)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg>
        <span>DCB Services Post</span>
      </div>

      <!-- 3. Daily Usage GSM -->
      <div class="nav-item" onclick="switchTool('tool3', this)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
        <span>Daily Usage GSM</span>
      </div>

      <!-- 4. Daily Usage ADSL -->
      <div class="nav-item" onclick="switchTool('tool4', this)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        <span>Daily Usage ADSL</span>
      </div>

      <!-- 5. Bill Explanation -->
      <div class="nav-item" onclick="switchTool('tool5', this)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        <span>Bill Explanation</span>
      </div>

      <!-- 6. WE Bonus -->
      <div class="nav-item" onclick="switchTool('tool6', this)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        <span>WE Bonus</span>
      </div>

      <!-- 7. GSM Pro -->
      <div class="nav-item" onclick="switchTool('tool7', this)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        <span>GSM Pro</span>
      </div>

      <!-- 8. Escalation Matrix -->
      <div class="nav-item" onclick="switchTool('tool8', this)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span>Escalation Matrix</span>
      </div>
    </nav>

    <div class="crm-user-profile">
      <div class="user-avatar">WE</div>
      <div>
        <div style="font-weight:700; color:var(--text-main);">Digital Support</div>
        <div style="font-size:11px;">Agent Workspace V 1.0</div>
      </div>
    </div>

    <!-- LEFT-ALIGNED FOOTER -->
    <footer class="crm-footer">
      Developed By: <strong>Geek and MZ</strong> ©2026
    </footer>
  </aside>

  <!-- MAIN WORKSPACE FRAMES -->
  <main class="crm-content">
    <iframe id="tool1" class="tool-frame active" src="DCB-Services.html"></iframe>
    <iframe id="tool2" class="tool-frame" src="DCB-Services-Post.html"></iframe>
    <iframe id="tool3" class="tool-frame" src="daily_Usage-GSM.html"></iframe>
    <iframe id="tool4" class="tool-frame" src="Daily_Usage_ADSL.html"></iframe>
    <iframe id="tool5" class="tool-frame" src="Bill-Explanation.html"></iframe>
    <iframe id="tool6" class="tool-frame" src="We-Bonus.html"></iframe>
    <iframe id="tool7" class="tool-frame" src="GSM-Pro.html"></iframe>
    <iframe id="tool8" class="tool-frame" src="Escalation-Matrix.html"></iframe>
  </main>
</div>

<!-- Protected & Fixed Navigation Logic -->
<script>
  function switchTool(toolId, element) {
    var frames = document.querySelectorAll('.tool-frame');
    var navs = document.querySelectorAll('.nav-item');
    
    for (var i = 0; i < frames.length; i++) {
      frames[i].classList.remove('active');
    }
    for (var j = 0; j < navs.length; j++) {
      navs[j].classList.remove('active');
    }
    
    document.getElementById(toolId).classList.add('active');
    element.classList.add('active');
  }

  // Keyboard Shortcuts Protection
  window.addEventListener('keydown', function(e) {
    if (
      e.key === 'F12' || 
      (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) || 
      (e.ctrlKey && (e.key === 'U' || e.key === 'u'))
    ) {
      e.preventDefault();
      return false;
    }
  });

  // Anti-DevTools Library Configuration
  DisableDevtool({
    ondevtoolopen: function() {
      if (!/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
        window.location.href = 'about:blank';
      }
    },
    disableMenu: true,
    clearLog: true,
    interval: 500
  });
</script>

</body>
</html>
